name: "Maven CI with CodeQL and GitHub Packages"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1' # Run every Monday at 8:00 UTC

jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    env:
      # OpenAI API key for tests
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # TestContainers configuration
      TESTCONTAINERS_RYUK_DISABLED: true
      TESTCONTAINERS_CHECKS_DISABLE: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github
        settings-path: ${{ github.workspace }}

    # Initialize CodeQL for security analysis
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    # Set up Docker for TestContainers
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Pull pgvector image to speed up TestContainers
    - name: Pre-pull Docker images for TestContainers
      run: |
        docker pull pgvector/pgvector:pg17
        echo "Pre-pulled pgvector image for TestContainers"

    - name: Debug Migration Files
      run: |
        echo "Listing migration files:"
        find src/main/resources/db/migration -type f | sort || echo "No migration files found"

    - name: Build with Maven and Run Tests (using TestContainers)
      run: ./mvnw -B clean package --file pom.xml
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    # CodeQL analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

    - name: SonarCloud Analysis
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: SonarQube Quality Gate check
      uses: sonarsource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        scanMetadataReportFile: .scannerwork/report-task.txt

    # Publish to GitHub Packages (only on main branch pushes)
    - name: Publish to GitHub Packages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: ./mvnw -B deploy --file pom.xml -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
